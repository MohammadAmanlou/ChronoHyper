name: Unit and hierarchy integrity
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Original contract and artifact tests
        run: python -m unittest discover -s tests -v
      - name: Research-lab tests
        run: python -m unittest research_lab.tests_lab research_lab.test_label_v2 research_lab.test_type_b_source_audit -v
      - name: Locked hierarchy structural verification
        run: python verify_selected_outputs.py --out outputs_selected
      - name: Submission handoff consistency (tracked files, hashes and Git cleanliness)
        run: python scripts/final_handoff.py --project .

      - name: Build and inspect authorized ZIP fallback from immutable Git HEAD
        run: python scripts/final_handoff.py --project . --package

      - name: Regenerate selected measured metrics without changing selection
        run: python scripts/generate_selected_metrics.py

      - name: AI-only review diagnostic integrity
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          def read(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))
          labels=read('research_outputs/label_v2/ai_label_review.csv')
          claims=read('research_outputs/type_b_audit/ai_claim_evidence_triage.csv')
          original_labels=read('research_outputs/label_v2/BLIND_LABEL_COMPARISON_TO_FILL.csv')
          original_claims=read('research_outputs/type_b_audit/CLAIM_LEVEL_REVIEW_BLANK.csv')
          assert len(labels)==len(original_labels)==24
          assert len(claims)==len(original_claims)==36
          assert {r['stable_id'] for r in labels}=={r['stable_id'] for r in original_labels}
          assert {r['claim_id'] for r in claims}=={r['claim_id'] for r in original_claims}
          assert all(r['not_independent_human']=='TRUE' for r in labels)
          assert all(r['human_review']=='BLANK_UNCHANGED' and r['independent_fulltext_check']=='NOT_CHECKED_AGAINST_FULL_PAPERS' for r in claims)
          assert all(not r.get('reviewer_id') and not r.get('A_accuracy_accurate_vague_wrong') and not r.get('B_accuracy_accurate_vague_wrong') for r in original_labels)
          assert all(not r.get('human_reviewer') and not r.get('manual_claim_supported_yes_no_unclear') for r in original_claims)
          assert not Path('research_outputs/label_v2/BLIND_KEY_KEEP_SEPARATE.json').exists()
          print('AI diagnostic scope correct; human review forms blank; secret absent')
          PY

      - name: Summarize AI-only pairing without touching human forms
        run: |
          python -m research_lab.label_v2 --project . --summarize-ai
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_outputs/label_v2/ai_paired_summary.json').read_text())
          assert r['sample_n']==24
          assert (r['v2_rating_wins'],r['v1_rating_wins'],r['rating_ties'])==(6,2,16)
          assert (r['general_preference_v2'],r['general_preference_v1'],r['general_preference_ties'])==(18,3,3)
          assert r['human_review'] is False and r['gloss_overclaim_rate'] is None
          print('AI pairing checked; no human validation or AI overclaim fabricated')
          PY

      - name: Primary-source audit scope integrity
        run: |
          python - <<'PY'
          import csv
          with open('research_outputs/type_b_audit/primary_source_audit.csv', encoding='utf-8-sig', newline='') as fp:
              rows=list(csv.DictReader(fp))
          assert len(rows)==36
          assert len({x['claim_id'] for x in rows})==36
          assert sum(x['external_evidence_scope']!='RUBRIC_ONLY_NOT_EXTERNALLY_CHECKED' for x in rows)==19
          assert all(x['full_claim_entailment']=='UNRESOLVED' and x['independent_fulltext_review']=='NOT_COMPLETED' for x in rows)
          assert all(bool(x['source_url_read'])==(x['external_evidence_scope']!='RUBRIC_ONLY_NOT_EXTERNALLY_CHECKED') for x in rows)
          print('36 claim provenance rows valid; 19 scoped URLs; zero invented full-text verdicts')
          PY
