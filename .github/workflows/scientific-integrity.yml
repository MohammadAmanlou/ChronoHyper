name: ChronoHyper scientific integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-evidence-checks:
    name: Clean Python 3.11 validation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install -r requirements.txt
      - name: Core source tests
        run: python -m unittest discover -s tests -v
      - name: Research and gold-separation tests
        run: |
          python -m unittest research_lab.tests_lab research_lab.test_label_v2 research_lab.test_type_b_source_audit -v
          python -m unittest research_lab.test_retrieval_frontier research_lab.test_frontier_historical research_lab.test_v3_provenance_audit research_lab.test_review_handoff research_lab.test_assessment_status research_lab.test_type_b_independent_handoff research_lab.test_fresh_retrieval research_lab.test_screen_fresh_questions research_lab.test_fresh_score_audit research_lab.test_advanced_retrieval research_lab.test_posthoc_retrieval_diagnostics research_lab.test_multiview_dense research_lab.test_multiview_source_union_audit research_lab.test_qwen_entity_rerank research_lab.test_qwen_candidate_preflight research_lab.test_type_b_answer_generation research_lab.test_fulltext_label_audit research_lab.test_auto_primary_evidence research_lab.test_auto_label_judge research_lab.test_evidence_gap_audit research_lab.test_retry_failed_auto_label_judge research_lab.test_record_inspected_paper research_lab.test_fetch_arxiv_abstracts research_lab.test_review_staged_abstracts -v
      - name: Regression-test source-delta temporal locality and controlled null
        run: python -m unittest research_lab.test_temporal_locality_audit -v
      - name: Audit source-delta locality on actual 2020/22/24 frozen selected hierarchies (no answer Gold)
        run: python -m research_lab.temporal_locality_audit --project . --permutations 499 --out local_only/temporal_locality_CI.json
      - name: Verify frozen hierarchy and hyperedge output
        run: python verify_selected_outputs.py --out outputs_selected
      - name: Generate developmental V3 labels in ignored output
        run: python -m research_lab.label_v3 --project . --out local_only/label_v3_dev
      - name: Exhaustive original-data V3 lexical provenance audit
        run: python -m research_lab.v3_provenance_audit --project . --out local_only/label_v3_dev/provenance_audit.json
      - name: Validate original-cor​​pus 24-case blinded full-text intake schema (no paper content fabricated)
        run: |
          python -m research_lab.label_v3_blind --project . --prepare
          python -m research_lab.fulltext_label_audit --project . --prepare
      - name: Verify prospective source-stratified question authoring kit
        run: python -m research_lab.fresh_retrieval --project . --author-kit
      - name: Read-only source and scientific-warning preflight
        run: python final_preflight.py --project . --write local_only/final_preflight_CI.json
      - name: Verify no tracked research results changed
        run: |
          test -z "$(git status --porcelain)"
          echo "Clean reproduction checks passed; independent semantic faithfulness remains unverified."
