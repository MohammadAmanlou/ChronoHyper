name: Final report build once
on:
  push:
    paths: ['.github/workflows/compile_paper_final_once.yml']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install XeLaTeX, plot packages and fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-liberation poppler-utils
      - name: Produce the official 3-5 page report
        run: |
          mkdir -p /tmp/paper
          xelatex -halt-on-error -interaction=nonstopmode -output-directory=/tmp/paper scripts/report.tex > /tmp/paper/build1.log
          xelatex -halt-on-error -interaction=nonstopmode -output-directory=/tmp/paper scripts/report.tex > /tmp/paper/build2.log
          cp /tmp/paper/report.pdf report.pdf
          pages=$(pdfinfo report.pdf | awk '/^Pages:/ {print $2}')
          echo "Report pages: $pages"
          test "$pages" -ge 3 && test "$pages" -le 5
          pdftotext report.pdf - | grep -q 'scientific'
          pdftotext report.pdf - | grep -q '72,701'
          pdftotext report.pdf - | grep -q '0.708'
      - name: Commit report.pdf only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.pdf
          if git diff --cached --quiet; then
            echo 'No PDF changes'
          else
            git commit -m "Build updated 3-5 page ChronoHyper final evidence report"
            git push origin HEAD:main
          fi
