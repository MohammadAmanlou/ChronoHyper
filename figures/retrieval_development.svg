<title id="t">Exploratory retrieval accuracy and candidate coverage for 34 previously inspected questions</title>
<desc id="d">Context BGE-M3: 10 of 34 Hit at five. Qwen3 raw and Qwen3 anchor one: 12 of 34 each. Reference entities in gold-blind candidate pool: 29 of 34, which is candidate recall not Hit at five.</desc>
